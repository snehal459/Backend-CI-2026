name: CI - DevOps AI Tool Hello

on:
  push:
    branches:
      #- main
      - ci-branch
  pull_request:
    branches:
      #- main
      - ci-branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

